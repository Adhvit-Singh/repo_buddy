# Publishes backend/ to a Hugging Face Docker Space.
# One-time setup (see docs/DEPLOY.md):
#   - repo secret  HF_TOKEN  = a Hugging Face write token
#   - repo variable HF_SPACE = "<hf-username>/<space-name>"
name: Deploy backend to Hugging Face

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backend/**"]

jobs:
  deploy:
    if: ${{ vars.HF_SPACE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push backend/ to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          set -euo pipefail
          cp -r backend /tmp/space && cd /tmp/space
          rm -rf tests .venv
          # Spaces read their settings from README front matter
          cat > README.md <<'EOF'
          ---
          title: repo_buddy API
          sdk: docker
          app_port: 7860
          pinned: false
          ---
          Backend API for [repo_buddy](https://github.com/Adhvit-Singh/repo_buddy).
          EOF
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "deploy ${GITHUB_SHA::7}"
          git push -f "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
